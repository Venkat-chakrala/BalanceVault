services:
  - type: web
    name: balancevault
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build && npm run db:generate && npm run db:push && npm run db:seed
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        value: super-secure-balancevault-production-key-9988776655
      - key: CORS_ORIGIN
        value: "*"
